# description
prim: Thread
usd: M30_THREAD_NEWTON_USD
mounting:
  pos: [1.0, 0.0, 0.65]
  rot: [0.0, 0.0, 1.0, 0.0]
viewer:
  origin_type: env
  env_index: 0
  eye: [0.45, 0.65, 1.0]
  lookat: [1.0, 0.0, 0.7]

# panel
panel:
  pos: [-0.02, 0.0, 0.0]
  rot: [0.0, 0.0, 0.0, 1.0]

# mechanism
mechanism:
  closed_end_stop: false
  joints:
    RevoluteJoint:
      damping: 0.05
      armature: 0.001
      friction: 0.1
      effort_limit_sim: 5.0
    PrismaticJoint: {effort_limit_sim: 500.0}

# screw
screw:
  pitch_m_per_revolution: 0.0035
  axial_reference: 0.007
  upper_limit: 0.025

# frames
frames:
  path: Geometry/World
  rot: [0.0, 0.0, 1.0, 0.0]
  targets:
    approaching:
      pos: [0.17, 0.0, 0.0]
      rot: [0.0, -0.04013179253255973, 0.999194395114446, 0.0]
    grasp:
      pos: [0.056, 0.0, 0.0]
      rot: [0.0, -0.04013179253255973, 0.999194395114446, 0.0]
    clear:
      pos: [0.086, 0.0, 0.0]
      rot: [0.0, -0.04013179253255973, 0.999194395114446, 0.0]
    rotate_frame:
      pos: [0.036, 0.0, 0.0]

# interaction
interaction:
  grasp_frame: grasp
  mode: contact_grasp
  grip_effort_scale: 0.5

# physics
physics:
  dynamics:
    ranges:
      friction: [0.05, 0.3]
      damping: [0.0, 0.1]
      armature: [0.001, 0.003]
  robot_material:
    static_friction_range: [0.8, 0.8]
    dynamic_friction_range: [0.6, 0.6]
  mechanism_material:
    static_friction_range: [0.5, 1.0]
    dynamic_friction_range: [0.4, 0.8]
