# description
prim: Valve
usd: SMALL_VALVE_USD
mounting:
  pos: [1.0, 0.0, 0.65]
  rot: [0.0, 0.0, -0.70710678, 0.70710678]
viewer: {body_name: eixo_trans}

# panel
panel:
  pos: [0.0, 0.075, 0.0]
  rot: [0.0, 0.0, 0.70710678, 0.70710678]

# mechanism
mechanism:
  closed_end_stop: false
  joints:
    RevoluteJoint:
      friction: 0.0002
      dynamic_friction: 0.0
      viscous_friction: 0.0
    PrismaticJoint:
      stiffness: 100000.0
      damping: 1000.0
      effort_limit_sim: 1000.0

# frames
frames:
  path: Geometry/valvula_gaveta/pivot_registro/eixo_trans
  rot: [0.0, 0.70710678, 0.0, 0.70710678]
  targets:
    approaching:
      pos: [0.0, 0.0, 0.2]
    rotate_frame:
      pos: [0.0, 0.0, 0.05]

# interaction
interaction:
  grasp_frame: rotate_frame
  mode: grasp

# physics
physics:
  dynamics:
    ranges:
      friction: [0.02, 1.0]
      damping: [0.0, 0.1]
      armature: [0.0005, 0.005]
  solver: {ls_iterations: 50}
