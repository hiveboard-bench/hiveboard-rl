# description
prim: CircuitBreaker
usd: CIRCUIT_BREAKER_USD
mounting:
  pos: [1.0, 0.0, 0.65]
  rot: [0.0, 0.0, 1.0, 0.0]
viewer: {body_name: lever_pivot}

# panel
panel:
  pos: [-0.04, 0.0, 0.0]
  rot: [0.0, 0.0, 0.0, 1.0]

# mechanism
mechanism:
  closed_end_stop: true
  end_stop_damping: 100.0
  joints:
    RevoluteJoint:
      friction: 0.02
      dynamic_friction: 0.0
      viscous_friction: 0.0

# frames
frames:
  path: Geometry/World
  rot: [0.0, 0.0, 1.0, 0.0]
  targets:
    approaching:
      pos: [0.1, 0.02, 0.02]
    lever_pivot_below:
      pos: [0.03, 0.0, -0.05]
    lever_pivot_above:
      pos: [0.03, 0.0, 0.09]

# interaction
interaction:
  grasp_frame: lever_pivot_below
  mode: push

# physics
physics:
  dynamics:
    ranges:
      friction: [0.01, 0.1]
      damping: [0.0, 0.005]
      breakaway: [0.0, 0.1]
      armature: [0.0005, 0.002]
    stuck_breakaway: [0.1, 0.1]
