# Paths are relative to the repository root. Each example records its first episode.
defaults:
  agent: rsl_rl_student_ppo_cfg_entry_point
  publication: true
  standard: true  # Authored placement, closed mechanism, home arm, fixed physics; no observation noise.
  video_length: 400  # Maximum policy steps; stop earlier on termination or timeout.
  seed: 0
  device: cuda:0
  timeout: 900      # Maximum wall seconds per attempt.
  crash_retries: 2

examples:
  - name: ball-valve
    task: Isaac-HiveBoard-Anymal-BallValve-RL-Play-v0
    checkpoint: logs/rsl_rl/anymal_ball_valve_student_ppo/2026-10-07_01-17-33_ballvalve_release_cap010_only_from999_50it_seed0/model_1048.pt
    args: ["env.actions.arm_action.max_position_error=0.1"]  # Trained with the 0.1 rad cap, now off by default.
  - name: m30-thread
    task: Isaac-HiveBoard-Anymal-M30Thread-RL-Play-v0
    checkpoint: logs/rsl_rl/anymal_m30_thread_student_ppo/2026-10-02_08-33-09_student_ppo_v1/model_600.pt
  - name: circuit-breaker
    task: Isaac-HiveBoard-Anymal-CircuitBreaker-RL-Play-v0
    checkpoint: logs/rsl_rl/anymal_circuit_breaker_student_ppo/2026-10-03_04-14-30_student_ppo_v2_raised/model_600.pt
